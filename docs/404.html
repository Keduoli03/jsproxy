<html>

  #msg {

    color: #71717a;
    text-align: center;
    max-width: 280px;
    line-height: 1.6;
  }
</style>
</head>

    function n(e){document.getElementById('msg').innerHTML=e}
    !function s(){
      if(self.isSecureContext)
        if(self.ReadableStream){

            }()+"sw.js").then(a)["catch"](i);

</html>
